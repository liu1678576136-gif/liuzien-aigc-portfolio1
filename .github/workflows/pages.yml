name: Deploy high-quality portfolio

on:
  push:
    branches: [codex/portfolio-live]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check scroll seeking and recovery
        run: node --test scripts/test-scroll-video.mjs scripts/test-portfolio-routes.mjs
      - name: Render work subpages without background scenes
        run: node scripts/test-work-pages.mjs
      - run: npm run build:pages
      - name: Verify original media and optimized scroll timing
        run: node scripts/verify-static-build.mjs
      - name: Decode independent HEVC and AVC segments
        run: node scripts/verify-scroll-decoding.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish portfolio
        id: deployment
        uses: actions/deploy-pages@v4
